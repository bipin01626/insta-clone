<!DOCTYPE html>
<html>
<head>
  <title>Insta Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<div class="container">

  <div class="sidebar">
    <h2>💬 Insta Chat</h2>
    <div id="users"></div>
  </div>

  <div class="chat">

    <div class="chat-header">
      Messages
      <button onclick="toggleDark()">🌙</button>
    </div>

    <div id="typing"></div>

    <ul id="messages"></ul>

    <div class="input-box">

      <input id="msg" placeholder="Message..." type="text">

      <button onclick="addEmoji('😊')">😊</button>
      <button onclick="addEmoji('😂')">😂</button>
      <button onclick="addEmoji('❤️')">❤️</button>

      <input type="file" id="file">

      <button onclick="sendText()">Send</button>
      <button onclick="sendImage()">📷</button>
      <button onclick="recordVoice()">🎤</button>

    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
